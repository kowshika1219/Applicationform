<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
</head>
<body>
    <h2> Application Form </h2>
    <form id="applicationForm">
        <label form="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>
        <label form="lastName">Last Name:</label>
        <input type="text" id="LastName" name="lastName" required>

        <br><br>

        <label form="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label form="age">Age:</label>
        <input type="number" id="age" name="age" required>
        <br><br>

        <label form="Gender">G:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label form="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label form="female">Female</label>
        <input type="radio" id="other" name="gender" value="other" required>
        <label form="other">Other</label>
    </div>
    <br><br>
    <label form="email">Email ID:</label>
    <input type="email" id="email" name="email" required>

<br><br>

    <label form="position">Position Available:</label>
        <input type="radio" id="Entry-Level Developer" name="Position Available" value="Entry-Level Developer" required>
        <label form="Entry-Level Developer">Entry-Level Developer</label>
        <input type="radio" id="Mid-Level Developer" name="Position Available" value="Mid-Level Developer">
        <label form="Mid-Level Developer">Mid-Level Developer</label>
        <input type="radio" id="Senior Developer" name="Position Available" value="Senior Developer">
        <label form="Senior Developer">Senior Developer</label>
<br><br>
        <label form="Placement Offers">Placement Offers:</label>
        <input type="Checkbox" id="Cloud" name="Cloud" value="Cloud" required>
        <label form="Cloud">Cloud</label>

        <input type="Checkbox" id="AWS" name="AWS" value="AWS" >
        <label form="AWS">AWS</label>

        <input type="Checkbox" id="Python" name="Python" value="Python">
        <label form="Python">Python</label>

        <input type="Checkbox" id="Java" name="Java" value="Java">
        <label form="Java">Java</label>
    </div>
    <br>
    <br>
    <label form="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <label form="confirmPassword">Confirm Password:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" required>
<br><br>
    <button type="submit" class="submit">Submit</button>
    <button type="reset" class="reset">Reset</button>
</form>
</body>
</html>
